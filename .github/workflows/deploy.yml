name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The site is served from https://<user>.github.io/<repo>/
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # GitHub Pages knows nothing about Angular routes, so a reload on /clients would 404.
      # Serving the app as the 404 page lets the router take over.
      - run: cp dist/kokilis-beauty-web/browser/index.html dist/kokilis-beauty-web/browser/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/kokilis-beauty-web/browser

      - id: deployment
        uses: actions/deploy-pages@v4
