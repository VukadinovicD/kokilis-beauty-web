<div class="login-page">
  <div class="login-card">
    <div class="brand-block">
      <img class="brand-logo" src="logo.png" alt="Kokiliiis Beauty" />
      <p>Zakažite svoj termin!</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="Unesite email adresu..." />
        <small *ngIf="form.controls.email.touched && form.controls.email.invalid">
          Unesite validnu email adresu!
        </small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="Unesite svoju lozinku..." />
        <small *ngIf="form.controls.password.touched && form.controls.password.invalid">
          Lozinka je obavezna!
        </small>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Logovanje...' : 'Ulogujte se' }}
      </button>
    </form>
  </div>
</div>
